name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install dependencies
        run: |
          python -m pip install \
            pydantic>=2.7 \
            python-dotenv>=1.0 \
            httpx>=0.27 \
            tenacity>=8.3 \
            PyYAML>=6.0 \
            pandas>=2.2 \
            numpy>=1.26 \
            rich>=13.7

          python -m pip install \
            pytest>=8.2 \
            mypy>=1.10 \
            ruff>=0.6 \
            types-PyYAML

      # scripts/* are self-contained projects with their own deps — excluded wholesale
      # from shared CI (see CLAUDE.md). Do not lint/typecheck/test them here.
      - name: Lint
        run: python -m ruff check . --exclude scripts

      - name: Typecheck
        run: python -m mypy . --exclude 'scripts/'

      # All test suites live inside scripts/* (ignored here). Exit code 5 = "no tests
      # collected" is expected at the root and treated as success.
      - name: Tests
        run: |
          set +e
          python -m pytest -q --ignore=scripts
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected outside scripts/ — OK"; exit 0; fi
          exit $code
